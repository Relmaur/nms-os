# Indexes the committed wiki mirror, type-checks, lints and unit-tests, then builds ATLAS:OS with Vite and deploys it
# to GitHub Pages. The build (which runs pnpm and every dependency's code) can read the repo and nothing more.
# CI never contacts the wiki: the mirror is refreshed by hand from Fandom's database dumps (ADR-0009), and the
# synced pages and wiki/verification.json arrive in a commit like any other change.
# Actions are pinned by commit (Dependabot proposes updates, .github/dependabot.yml).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the derived indexes (index.json, game-data.json, facts.json, the Codex bundle) from the committed
      # archive. No network: the archive only changes through a dump sync committed to the repo.
      - name: Index the wiki archive
        run: pnpm index:wiki

      # Gate: nothing is deployed unless types, lint and unit tests pass.
      # Browser tests (pnpm test:e2e) run locally as part of pnpm check, not in CI, to keep runs short.
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test

      # The service worker's precache revisions come from file contents, so every deploy updates installed apps.
      - name: Build the site
        run: pnpm build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

# Syncs the wiki mirror, runs lint + unit + browser tests, then deploys ATLAS // MASTER OS to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly wiki refresh, Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write # the sync commits changed wiki pages back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev tools (ESLint, Playwright)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Mirrors the wiki's game-data pages over the committed archive (only pages with a new revision change)
      # and writes wiki/verification.json, which the Codex shows. If the wiki is unreachable, the committed
      # archive ships as-is and the Codex says it couldn't be checked.
      - name: Sync and verify the wiki mirror
        run: node scripts/sync-wiki.mjs

      # Gate: nothing is committed back or deployed unless lint, unit and browser tests pass on the synced data.
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Browser tests (desktop + phone)
        run: npm run test:e2e

      # Keeps the repo's archive in step with the wiki without anyone running the sync locally. Pushes made with
      # GITHUB_TOKEN don't trigger another workflow run, so this can't loop.
      - name: Commit wiki changes back to main
        if: github.ref == 'refs/heads/main'
        run: |
          git add wiki
          if git diff --cached --quiet; then echo "The wiki mirror is unchanged."; exit 0; fi
          pages=$(git diff --cached --name-only -- '*.md' | wc -l | tr -d ' ')
          list=$(git diff --cached --name-only -- '*.md' | sed 's#^wiki/##; s#\.md$##' | head -100)
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Sync wiki mirror: ${pages} page(s) changed on the wiki" -m "${list}"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::Could not push the wiki sync commit." && exit 1

      - name: Stamp the service worker so this deploy gets a fresh offline cache
        run: sed -i "s/^const BUILD = 'dev';/const BUILD = '${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}';/" sw.js

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html nms_state.json manifest.webmanifest sw.js assets wiki _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

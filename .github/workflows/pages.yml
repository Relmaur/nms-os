# Builds the wiki and deploys ATLAS // MASTER OS to GitHub Pages as an installable, offline-capable app.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly wiki refresh, Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The committed articles are the baseline: this only refreshes pages whose content changed upstream.
      # If the Fandom API is unreachable, the harvest is skipped and the committed copies ship as-is.
      - name: Build the wiki (seed + harvest + index)
        run: node scripts/sync-wiki.mjs

      - name: Stamp the service worker so this deploy gets a fresh offline cache
        run: sed -i "s/^const BUILD = 'dev';/const BUILD = '${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}';/" sw.js

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html nms_state.json manifest.webmanifest sw.js assets wiki _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

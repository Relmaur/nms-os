<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wiki Codex · ATLAS:OS</title>
    <!-- Installable app (PWA) — same manifest and service worker as the main page -->
    <meta name="theme-color" content="#050811">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ATLAS:OS">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="../src/codex.css">
</head>
<body class="min-h-screen font-sans">

    <!-- Start-up screen: gone once the page has drawn (src/ui/parts/boot.ts) -->
    <div id="bootSplash" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2l9 10-9 10-9-10z"/></svg>
        <span class="boot-word">ATLAS<span>:OS</span></span>
    </div>

    <div id="toastBanner" role="status" aria-live="polite" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-6 sm:bottom-6 sm:max-w-sm z-[80] hidden items-center gap-3 px-4 py-3 rounded-xl bg-slate-900 border border-emerald-400/40 text-emerald-50 shadow-[0_16px_40px_-12px_rgba(0,0,0,0.8)] text-xs">
        <i class="ph-fill ph-check-circle text-lg text-emerald-400 shrink-0"></i>
        <span id="toastMessage"></span>
    </div>

    <!-- Rendered by React (src/ui/codex/Codex.tsx): header search, browse, article, quick look, New article -->
    <div id="codexRoot"></div>

    <!-- Same tab bar and search key as the main app (below lg; src/ui/shell/TabBar.tsx) -->
    <div class="lg:hidden">
        <nav aria-label="Primary" class="tab-bar">
            <a href="../#home" data-tab="home" class="tab-item"><span class="tab-icon"><i class="ph-bold ph-house" aria-hidden="true"></i></span><span>Home</span></a>
            <a href="../#systems" data-tab="log" class="tab-item"><span class="tab-icon"><i class="ph-bold ph-planet" aria-hidden="true"></i></span><span>Log</span></a>
            <a href="../#runs" data-tab="runs" class="tab-item"><span class="tab-icon"><i class="ph-bold ph-path" aria-hidden="true"></i></span><span>Runs</span></a>
            <a href="#/" data-tab="codex" aria-current="page" class="tab-item"><span class="tab-icon"><i class="ph-bold ph-book-open" aria-hidden="true"></i></span><span>Codex</span></a>
        </nav>
        <a href="../#search" aria-label="Search and quick actions" class="search-key"><i class="ph-bold ph-magnifying-glass" aria-hidden="true"></i></a>
    </div>

    <script type="module" src="../src/ui/codex/main.tsx"></script>
</body>
</html>

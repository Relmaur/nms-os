<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ATLAS // MASTER OS</title>
    <meta name="description" content="Local-first No Man's Sky companion: systems log, outlaw runs, calculators, an offline wiki Codex and the six-book guide.">
    <!-- Installable app (PWA) -->
    <meta name="theme-color" content="#050811">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Atlas OS">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Tailwind, fonts, icons and theme: bundled by Vite (src/styles.css) -->
    <link rel="stylesheet" href="src/styles.css">
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- Toast Notification Banner -->
    <div id="toastBanner" role="status" aria-live="polite" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-6 sm:bottom-6 sm:max-w-sm z-[70] hidden items-center gap-3 px-4 py-3 rounded-xl bg-slate-900 border border-cyan-400/40 text-cyan-100 shadow-[0_16px_40px_-12px_rgba(0,0,0,0.8)] text-xs">
        <i class="ph-fill ph-check-circle text-lg text-emerald-400 shrink-0"></i>
        <span id="toastMessage">Action completed</span>
    </div>

    <!-- Top header: logo, search, Export/Import (React: src/ui/shell/Header.tsx) -->
    <header id="headerRoot" class="app-header sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-slate-800"></header>

    <!-- Main Workspace Container -->
    <div class="flex-1 max-w-[1600px] w-full mx-auto flex relative">

        <!-- Desktop navigation, the bottom tab bar replaces it below lg (React: src/ui/shell/Sidebar.tsx) -->
        <aside id="sidebarNav" aria-label="Primary" class="hidden lg:flex lg:sticky lg:top-16 lg:h-[calc(100dvh-4rem)] lg:w-72 lg:shrink-0 flex-col"></aside>

        <!-- Main Content Area -->
        <main class="app-main flex-1 min-w-0 px-4 py-5 sm:p-6 lg:p-8">

            <!-- Storage problems: shown until resolved or dismissed (React: src/ui/shell/StorageBanner.tsx) -->
            <div id="storageBannerRoot"></div>
            <!-- While you play: the session and its timers (React: src/ui/session/SessionBar.tsx) -->
            <div id="sessionBarRoot"></div>

            <!-- ===================================================================== -->
            <!-- HOME: what you need mid-session (React: src/ui/home/Home.tsx)             -->
            <!-- ===================================================================== -->
            <section id="sec-home" class="book-section">
                <div id="homeRoot" class="space-y-6"></div>
            </section>

            <!-- ===================================================================== -->
            <!-- GUIDES, the six books and MORE (React: src/ui/guides/, src/ui/more/)  -->
            <!-- ===================================================================== -->
            <section id="sec-guides" class="book-section hidden">
                <div id="guidesRoot" class="space-y-6"></div>
            </section>
            <section id="sec-more" class="book-section hidden max-w-2xl">
                <div id="moreRoot" class="space-y-7"></div>
            </section>
            <section id="sec-book1" class="book-section hidden"><div id="book1Root" class="space-y-6"></div></section>
            <section id="sec-book2" class="book-section hidden"><div id="book2Root" class="space-y-6"></div></section>
            <section id="sec-book3" class="book-section hidden"><div id="book3Root" class="space-y-6"></div></section>
            <section id="sec-book4" class="book-section hidden"><div id="book4Root" class="space-y-6"></div></section>
            <section id="sec-book5" class="book-section hidden"><div id="book5Root" class="space-y-6"></div></section>
            <section id="sec-book6" class="book-section hidden"><div id="book6Root" class="space-y-6"></div></section>

            <!-- ===================================================================== -->
            <!-- CALCULATORS (src/ui/calculators · wiki/game-data.json)                -->
            <!-- ===================================================================== -->
            <section id="sec-calculators" class="book-section hidden">
                <!-- Rendered by React (src/ui/calculators/Calculators.tsx) --><div id="calculatorsRoot" class="space-y-6"></div>
            </section>

            <!-- ===================================================================== -->
            <!-- SYSTEMS LOG (src/ui/systems · nms_state.json → systems)                   -->
            <!-- ===================================================================== -->
            <section id="sec-systems" class="book-section hidden">
                <!-- Rendered by React (src/ui/systems/Systems.tsx) --><div id="systemsRoot" class="space-y-6"></div>
            </section>

            <!-- ===================================================================== -->
            <!-- YOUR GEAR AND NOTES (src/ui/gear, src/ui/notes · nms_state.json → gear, notes) -->
            <!-- ===================================================================== -->
            <section id="sec-gear" class="book-section hidden">
                <div id="gearRoot" class="space-y-6"></div>
            </section>
            <section id="sec-notes" class="book-section hidden max-w-3xl">
                <div id="notesRoot" class="space-y-6"></div>
            </section>

            <!-- ===================================================================== -->
            <!-- OUTLAW RUN (systems tagged "outlaw" · Suspicious Packet Nanite flip)  -->
            <!-- ===================================================================== -->
            <section id="sec-outlaw" class="book-section hidden">
                <!-- Rendered by React (src/ui/outlaw/Outlaw.tsx) --><div id="outlawRoot" class="space-y-6"></div>
            </section>

        </main>
    </div>

    <!-- Bottom tab bar below lg; the Codex page carries the same bar (React: src/ui/shell/TabBar.tsx) -->
    <div id="tabBarRoot"></div>

    <!-- System detail / editor: side panel from md, bottom sheet below. Rendered by React (src/ui/systems/SystemPanel.tsx) -->
    <div id="systemPanelRoot"></div>
    <!-- Session sheet: timers, add a timer, the recap (React: src/ui/session/SessionSheet.tsx) -->
    <div id="sessionSheetRoot"></div>
    <!-- Editors for your ships, Multi-Tools and notes (React: src/ui/PlayerEditors.tsx) -->
    <div id="playerEditorRoot"></div>

    <script type="module" src="src/app/main.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Codex · ATLAS // MASTER OS</title>
    <!-- Installable app (PWA) — same manifest and service worker as the main page -->

    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="../assets/theme.css">

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="../assets/wiki-search.js"></script>
    <style>
        .facet { display: flex; align-items: center; gap: 0.625rem; width: 100%; min-height: 2.5rem; padding: 0.375rem 0.625rem; border-radius: 0.625rem; font-size: 0.8125rem; color: #94a3b8; text-align: left; transition: background-color 150ms ease, color 150ms ease; }
        .facet:hover { color: #fff; background: rgba(30, 41, 59, 0.55); }
        .facet[aria-pressed="true"] { color: #fff; background: rgba(16, 185, 129, 0.1); box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.3); }
        .facet[disabled] { opacity: 0.4; pointer-events: none; }
        .facet .count { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b9ab0; font-variant-numeric: tabular-nums; }
        .chip { flex: none; display: inline-flex; align-items: center; gap: 0.375rem; height: 2.25rem; padding: 0 0.875rem; border-radius: 9999px; border: 1px solid #334155; background: #0f172a; font-size: 0.8125rem; color: #cbd5e1; white-space: nowrap; }
        .chip[aria-pressed="true"] { border-color: rgba(52, 211, 153, 0.6); background: rgba(16, 185, 129, 0.15); color: #a7f3d0; }
        .letter { flex: none; display: grid; place-items: center; min-width: 2rem; height: 2rem; border-radius: 0.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #cbd5e1; transition: background-color 120ms ease, color 120ms ease; }
        .letter:hover { background: rgba(30, 41, 59, 0.8); color: #fff; }
        .letter[aria-pressed="true"] { background: #34d399; color: #022c22; font-weight: 600; }
        .letter[disabled] { color: #334155; pointer-events: none; }
        .result { display: flex; gap: 0.75rem; align-items: flex-start; padding: 0.875rem 1rem; border-radius: 0.875rem; border: 1px solid transparent; transition: background-color 120ms ease, border-color 120ms ease; }
        .result:hover { background: rgba(15, 23, 42, 0.7); }
        .result[aria-selected="true"] { background: rgba(15, 23, 42, 0.95); border-color: rgba(52, 211, 153, 0.35); }
        .result mark, .peek-meta mark { background: rgba(52, 211, 153, 0.2); color: #a7f3d0; border-radius: 0.2rem; padding: 0 0.1rem; }
        .toc-link { display: block; width: 100%; text-align: left; padding: 0.25rem 0 0.25rem 0.75rem; border-left: 1px solid #1e293b; font-size: 0.8125rem; color: #94a3b8; transition: color 120ms ease, border-color 120ms ease; }
        .toc-link:hover { color: #fff; }
        .toc-link[data-depth="3"] { padding-left: 1.5rem; font-size: 0.75rem; }
        .toc-link.is-active { color: #6ee7b7; border-left-color: #34d399; }
        .md-body { font-size: 0.9375rem; line-height: 1.75; max-width: 72ch; }
        .md-body h2 { scroll-margin-top: 5.5rem; }
        .md-body h3 { scroll-margin-top: 5.5rem; }
        #peekPanel .md-body { font-size: 0.875rem; }
        .is-hidden { display: none !important; } /* beats lg:grid, unlike Tailwind's .hidden */
        .no-scrollbar { scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen font-sans">

    <div id="toastBanner" role="status" aria-live="polite" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-6 sm:bottom-6 sm:max-w-sm z-[80] hidden items-center gap-3 px-4 py-3 rounded-xl bg-slate-900 border border-emerald-400/40 text-emerald-50 shadow-[0_16px_40px_-12px_rgba(0,0,0,0.8)] text-xs">

            <div class="relative flex-1 max-w-2xl mx-auto">

                <input type="search" id="codexSearch" autocomplete="off" spellcheck="false" aria-label="Search the Codex" placeholder="Search titles and full text…" oninput="onSearchInput(this.value)" onkeydown="onSearchKey(event)" class="w-full h-10 bg-slate-900 border border-slate-700 hover:border-slate-600 focus:border-emerald-400 rounded-xl pl-9 pr-10 text-base md:text-sm text-white placeholder:text-slate-500 focus:outline-none transition">
                <kbd class="hidden md:block absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-mono text-slate-400 border border-slate-700 rounded px-1.5 py-0.5 pointer-events-none">/</kbd>

            <button onclick="openCreateModal()" aria-label="New article" class="shrink-0 h-10 px-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-sm font-semibold flex items-center gap-2 transition">

    <main class="max-w-[1400px] mx-auto px-4 sm:px-6 py-6 lg:py-8">

        <!-- Browse / search -->
        <div id="browseView" class="lg:grid lg:grid-cols-[15rem_minmax(0,1fr)] lg:gap-10">
            <aside class="hidden lg:block">
                <div class="sticky top-24 space-y-8">

                    </div>
                    <div>

                        <div id="sourceFacets" class="space-y-0.5"></div>
                    </div>
                    <div>
                        <p class="nav-group-label">Sort</p>
                        <div id="sortFacets" class="space-y-0.5"></div>
                    </div>
                </div>
            </aside>

            <section class="min-w-0 space-y-5">
                <!-- Mobile filters -->
                <div class="lg:hidden space-y-3">
                    <div id="categoryChips" class="-mx-4 px-4 flex gap-2 overflow-x-auto no-scrollbar"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="relative">
                            <span class="sr-only">Source</span>

                        </label>

                </div>

                <div id="resultsHeader" class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-2"></div>
                <nav id="letterBar" aria-label="Browse by letter" class="-mx-4 px-4 sm:mx-0 sm:px-0 flex gap-1 overflow-x-auto no-scrollbar"></nav>

    <!-- Quick look: side panel on desktop, bottom sheet on mobile -->

    <aside id="peekPanel" role="dialog" aria-modal="false" aria-labelledby="peekTitle" class="fixed z-50 flex flex-col bg-slate-950 border-slate-700 shadow-[0_24px_64px_-12px_rgba(0,0,0,0.85)] transition-transform duration-300 ease-[cubic-bezier(0.16,1,0.3,1)]
        inset-x-0 bottom-0 h-[85dvh] rounded-t-3xl border-t translate-y-full
        md:inset-x-auto md:right-0 md:top-0 md:h-full md:w-[min(36rem,48vw)] md:rounded-none md:border-t-0 md:border-l md:translate-y-0 md:translate-x-full">
        <div class="md:hidden flex justify-center pt-2.5"><span class="w-10 h-1 rounded-full bg-slate-700"></span></div>
        <div class="px-5 pt-4 pb-4 border-b border-slate-800 space-y-3">
            <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                    <p id="peekMeta" class="peek-meta flex flex-wrap items-center gap-2 text-xs text-slate-400"></p>
                    <h2 id="peekTitle" class="font-display font-bold text-lg text-white mt-1.5 leading-snug"></h2>
                </div>
                <button onclick="closePeek()" aria-label="Close quick look" class="shrink-0 w-9 h-9 -mr-1.5 rounded-xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-900"><i class="ph-bold ph-x text-lg"></i></button>
            </div>
            <div class="flex items-center gap-2">
                <a id="peekOpen" href="#/" class="h-9 px-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-sm font-semibold flex items-center gap-2 transition">Open article <i class="ph-bold ph-arrow-right"></i></a>
                <span class="hidden md:inline text-xs text-slate-400 ml-auto"><kbd class="font-mono border border-slate-700 rounded px-1">↑</kbd> <kbd class="font-mono border border-slate-700 rounded px-1">↓</kbd> browse · <kbd class="font-mono border border-slate-700 rounded px-1">Enter</kbd> open</span>
            </div>
        </div>
        <div id="peekBody" class="md-body flex-1 overflow-y-auto overscroll-contain px-5 py-5"></div>
    </aside>

    <!-- New article -->
    <div id="createModal" class="fixed inset-0 z-[60] hidden items-end sm:items-center justify-center bg-slate-950/80 backdrop-blur-sm sm:p-4" onclick="if (event.target === this) closeCreateModal()">
        <div role="dialog" aria-modal="true" aria-labelledby="createTitle" class="w-full max-w-4xl max-h-[92dvh] overflow-y-auto rounded-t-3xl sm:rounded-2xl bg-slate-950 border border-slate-700 p-5 space-y-3">
            <div class="flex items-center justify-between">
                <h2 id="createTitle" class="font-display font-bold text-base text-white">New article</h2>
                <button onclick="closeCreateModal()" aria-label="Close" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-900"><i class="ph-bold ph-x text-lg"></i></button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input type="text" id="newTitle" placeholder="Article title" class="md:col-span-2 h-10 bg-slate-900 border border-slate-700 rounded-xl px-3 text-base md:text-sm text-white">
                <select id="newCategory" class="h-10 bg-slate-900 border border-slate-700 rounded-xl px-3 text-base md:text-sm text-white"></select>
            </div>
            <input type="text" id="newSummary" placeholder="One-line summary (shown in search results)" class="w-full h-10 bg-slate-900 border border-slate-700 rounded-xl px-3 text-base md:text-sm text-white">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <textarea id="newBody" rows="14" oninput="renderCreatePreview()" placeholder="## Overview&#10;Write Markdown here. Link other articles with [[Article Title]]." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-base md:text-sm font-mono text-white"></textarea>
                <div id="newPreview" class="md-body text-sm bg-slate-900/50 border border-slate-800 rounded-xl p-4 overflow-y-auto max-h-[22rem]"></div>
            </div>
            <p class="text-xs text-slate-400">Downloads as <code class="text-emerald-300">&lt;Title&gt;.md</code>. Move it into <code class="text-emerald-300">wiki/custom/&lt;category&gt;/</code> and run <code class="text-emerald-300">npm run index:wiki</code>; until then it stays in this browser as a draft.</p>
            <div class="flex justify-end gap-2">
                <button onclick="closeCreateModal()" class="h-10 px-4 rounded-xl bg-slate-900 border border-slate-700 text-sm text-slate-300 hover:bg-slate-800">Cancel</button>
                <button onclick="saveDraft()" class="h-10 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-sm flex items-center gap-2"><i class="ph-bold ph-download-simple"></i> Save draft & download</button>
            </div>
        </div>
    </div>

    <script>
        const { CATEGORIES, SOURCES, escapeHtml } = WikiSearch;
        const PAGE_SIZE = 20;
        const LETTERS = ['#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
        const DEFAULTS = { q: '', cat: 'all', src: 'all', letter: '', sort: 'relevance', page: 1 };

        let entries = [];
        let byPath = new Map();
        let state = { ...DEFAULTS };
        let results = [];        // current page's results, for keyboard + quick look
        let selected = -1;
        let peekIndex = -1;
        let tocObserver = null;

        // ---------------------------------------------------------------------
        // Routing: #/?q=…&cat=…  (browse)   #/a/<path>?q=…  (article)
        // ---------------------------------------------------------------------
        function parseHash() {
            const [route, query = ''] = (location.hash.slice(1) || '/').split('?');
            const params = new URLSearchParams(query);
            const next = { ...DEFAULTS };
            Object.keys(DEFAULTS).forEach(key => { if (params.has(key)) next[key] = params.get(key); });
            next.page = Math.max(1, parseInt(next.page, 10) || 1);
            if (!(next.cat in CATEGORIES)) next.cat = 'all';
            if (!(next.src in SOURCES) || next.src === 'draft') next.src = 'all';
            return route.startsWith('/a/') ? { view: 'article', path: decodeURIComponent(route.slice(3)), state: next } : { view: 'browse', state: next };
        }

        function queryString(s) {
            const params = new URLSearchParams();
            Object.entries(s).forEach(([key, value]) => { if (String(value) !== String(DEFAULTS[key])) params.set(key, value); });
            const qs = params.toString();
            return qs ? `?${qs}` : '';
        }

        function browseHref(s = state) { return `#/${queryString(s)}`; }
        function articleHref(path) { return `#/a/${encodeURIComponent(path)}${state.q ? `?q=${encodeURIComponent(state.q)}` : ''}`; }

        // Typing replaces history; filter clicks and opening articles push it, so Back works naturally.
        function setParams(changes, { push = true } = {}) {
            const href = browseHref({ ...state, ...changes });
            if (push) location.hash = href;
            else { history.replaceState(null, '', href); route(); }
        }

        function clearAll() {
            document.getElementById('codexSearch').value = '';
            location.hash = '#/';
        }

        function route() {
            const parsed = parseHash();
            state = parsed.state;
            const input = document.getElementById('codexSearch');
            if (document.activeElement !== input) input.value = state.q;
            closePeek();
            const isArticle = parsed.view === 'article';
            document.getElementById('browseView').classList.toggle('is-hidden', isArticle);
            document.getElementById('articleView').classList.toggle('is-hidden', !isArticle);
            if (isArticle) renderArticle(parsed.path);
            else renderBrowse();
        }

        // ---------------------------------------------------------------------
        // Browse
        // ---------------------------------------------------------------------
        function count(list, key) {
            return list.reduce((acc, item) => { acc[item.entry[key]] = (acc[item.entry[key]] || 0) + 1; return acc; }, {});
        }

        function renderBrowse() {
            const base = WikiSearch.search(entries, state.q);
            const srcMatch = r => state.src === 'all' || r.entry.source === state.src || (state.src === 'custom' && r.entry.source === 'draft');
            const catMatch = r => state.cat === 'all' || r.entry.category === state.cat;
            const letterMatch = r => !state.letter || r.entry._letter === state.letter;

            const catCounts = count(base.filter(r => srcMatch(r) && letterMatch(r)), 'category');
            const srcCounts = count(base.filter(r => catMatch(r) && letterMatch(r)), 'source');
            srcCounts.custom = (srcCounts.custom || 0) + (srcCounts.draft || 0);
            const letterSet = new Set(base.filter(r => srcMatch(r) && catMatch(r)).map(r => r.entry._letter));
            let filtered = base.filter(r => srcMatch(r) && catMatch(r) && letterMatch(r));
            if (state.sort === 'az' && state.q) filtered = [...filtered].sort((a, b) => a.entry._title.localeCompare(b.entry._title));

            renderFacets(catCounts, srcCounts, base.filter(r => srcMatch(r) && letterMatch(r)).length);
            renderLetters(letterSet);

            const isLanding = !state.q && state.cat === 'all' && state.src === 'all' && !state.letter;
            if (!entries.length) {
                results = [];
                document.getElementById('resultsHeader').innerHTML = '';
                document.getElementById('pagination').innerHTML = '';
                document.getElementById('browseBody').innerHTML = `
                    <div class="rounded-2xl border border-dashed border-slate-700 p-8 text-center space-y-3">
                        <i class="ph-duotone ph-books text-4xl text-emerald-300"></i>
                        <h2 class="font-display font-bold text-lg text-white">The Codex is empty</h2>
                        <p class="text-sm text-slate-300 max-w-md mx-auto">Run <code class="text-emerald-300">npm run sync:wiki</code> to download the wiki (or <code class="text-emerald-300">npm run seed:wiki</code> offline), then reload this page.</p>
                    </div>`;
                return;
            }
            if (isLanding) return renderLanding();

            const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
            const page = Math.min(state.page, pages);
            results = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
            selected = -1;
            renderResultsHeader(filtered.length);
            renderResults();
            renderPagination(page, pages, filtered.length);
        }

        function renderFacets(catCounts, srcCounts, total) {
            const facet = (label, icon, n, pressed, onclick) => `
                <button class="facet" aria-pressed="${pressed}" ${n ? '' : 'disabled'} onclick="${onclick}">
                    <i class="ph-bold ${icon} text-base"></i><span class="truncate">${label}</span><span class="count">${n}</span>
                </button>`;
            document.getElementById('categoryFacets').innerHTML =
                facet('All categories', 'ph-squares-four', total, state.cat === 'all', "setParams({ cat: 'all', page: 1 })") +
                Object.entries(CATEGORIES).map(([key, meta]) => facet(meta.label, meta.icon, catCounts[key] || 0, state.cat === key, `setParams({ cat: '${key}', page: 1 })`)).join('');

            const sourceOptions = [['all', 'All sources', 'ph-stack'], ['seed', 'Codex notes', 'ph-star'], ['custom', 'Custom', 'ph-pencil-simple'], ['wiki', 'Wiki pages', 'ph-globe']];
            const srcTotal = Object.entries(srcCounts).filter(([key]) => key !== 'draft').reduce((sum, [, n]) => sum + n, 0);
            document.getElementById('sourceFacets').innerHTML = sourceOptions
                .map(([key, label, icon]) => facet(label, icon, key === 'all' ? srcTotal : srcCounts[key] || 0, state.src === key, `setParams({ src: '${key}', page: 1 })`)).join('');

            const sorts = [['relevance', 'Best match', 'ph-sparkle'], ['az', 'A–Z', 'ph-sort-ascending']];
            document.getElementById('sortFacets').innerHTML = sorts.map(([key, label, icon]) => `
                <button class="facet" aria-pressed="${state.sort === key}" onclick="setParams({ sort: '${key}', page: 1 })"><i class="ph-bold ${icon} text-base"></i><span>${label}</span></button>`).join('');

            document.getElementById('categoryChips').innerHTML =
                `<button class="chip" aria-pressed="${state.cat === 'all'}" onclick="setParams({ cat: 'all', page: 1 })">All <span class="text-slate-400 font-mono text-xs">${total}</span></button>` +
                Object.entries(CATEGORIES).map(([key, meta]) => `<button class="chip" aria-pressed="${state.cat === key}" onclick="setParams({ cat: '${key}', page: 1 })"><i class="ph-bold ${meta.icon}"></i>${meta.label} <span class="text-slate-400 font-mono text-xs">${catCounts[key] || 0}</span></button>`).join('');
            document.getElementById('sourceSelect').innerHTML = sourceOptions
                .map(([key, label]) => `<option value="${key}" ${state.src === key ? 'selected' : ''}>${label} (${key === 'all' ? srcTotal : srcCounts[key] || 0})</option>`).join('');
            document.getElementById('sortSelect').value = state.sort;
        }

        function renderLetters(available) {
            document.getElementById('letterBar').innerHTML =
                `<button class="letter px-2.5" aria-pressed="${!state.letter}" onclick="setParams({ letter: '', page: 1 })">All</button>` +
                LETTERS.map(letter => `<button class="letter" aria-pressed="${state.letter === letter}" ${available.has(letter) ? '' : 'disabled'} onclick="setParams({ letter: '${letter}', page: 1 })" aria-label="Titles starting with ${letter === '#' ? 'a number or symbol' : letter}">${letter}</button>`).join('');
        }

        function exampleTitles(category) {
            return entries
                .filter(entry => entry.category === category)
                .sort((a, b) => (a.source === 'wiki') - (b.source === 'wiki') || a._title.localeCompare(b._title))
                .slice(0, 3);
        }

        function renderLanding() {
            results = entries.filter(entry => entry.source !== 'wiki').sort((a, b) => a._title.localeCompare(b._title)).map(entry => ({ entry, field: 'title' }));
            selected = -1;
            document.getElementById('pagination').innerHTML = '';
            document.getElementById('resultsHeader').innerHTML = `
                <div>
                    <h1 class="font-display font-bold text-2xl sm:text-3xl text-white">Wiki Codex</h1>
                    <p class="text-sm text-slate-300 mt-1">${entries.length.toLocaleString()} articles. Search the full text, pick a category, or jump by letter.</p>
                </div>`;
            const tiles = Object.entries(CATEGORIES).map(([key, meta]) => {
                const n = entries.filter(entry => entry.category === key).length;
                return `
                <a href="${browseHref({ ...DEFAULTS, cat: key })}" class="group block rounded-2xl bg-slate-900/60 border border-slate-800 hover:border-emerald-500/40 hover:bg-slate-900 p-4 transition">
                    <div class="flex items-center gap-3">
                        <span class="nav-tile text-emerald-300"><i class="ph-bold ${meta.icon}"></i></span>
                        <div class="min-w-0">
                            <p class="text-sm font-semibold text-white">${meta.label}</p>
                            <p class="text-xs text-slate-400">${n} articles</p>
                        </div>
                        <i class="ph-bold ph-arrow-right ml-auto text-slate-500 group-hover:text-emerald-300 transition"></i>
                    </div>
                    <p class="text-xs text-slate-400 mt-3">${meta.blurb}</p>
                    <p class="text-xs text-slate-300 mt-2 truncate">${exampleTitles(key).map(entry => escapeHtml(entry.title)).join(' · ')}</p>
                </a>`;
            }).join('');
            const notes = results.map((result, i) => `
                <li>
                    <button data-i="${i}" onclick="peek(${i})" class="result w-full text-left" aria-selected="false">
                        <span class="nav-tile text-amber-300 mt-0.5"><i class="ph-bold ${CATEGORIES[result.entry.category]?.icon || 'ph-file-text'}"></i></span>
                        <span class="min-w-0 flex-1">
                            <span class="flex items-center gap-2"><strong class="text-sm text-white truncate">${escapeHtml(result.entry.title)}</strong>${WikiSearch.badge(result.entry.source)}</span>
                            <span class="block text-xs text-slate-400 mt-0.5 line-clamp-2">${escapeHtml(result.entry.summary)}</span>
                        </span>
                    </button>
                </li>`).join('');
            document.getElementById('browseBody').innerHTML = `
                <div class="space-y-10">
                    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">${tiles}</div>
                    <div class="space-y-3">
                        <div class="flex items-baseline justify-between gap-4">
                            <h2 class="font-display font-bold text-base text-white">Your Codex notes</h2>
                            <a href="${browseHref({ ...DEFAULTS, src: 'seed' })}" class="text-xs font-medium text-emerald-300 hover:text-emerald-200">Browse notes →</a>
                        </div>
                        <ul class="grid grid-cols-1 xl:grid-cols-2 gap-1">${notes}</ul>
                    </div>
                </div>`;
        }

        function renderResultsHeader(total) {
            const chips = [];
            if (state.q) chips.push(['q', `“${escapeHtml(state.q)}”`]);
            if (state.cat !== 'all') chips.push(['cat', CATEGORIES[state.cat].label]);
            if (state.src !== 'all') chips.push(['src', SOURCES[state.src].label]);
            if (state.letter) chips.push(['letter', `Starts with ${state.letter}`]);
            document.getElementById('resultsHeader').innerHTML = `
                <p class="text-sm text-slate-300"><strong class="text-white font-semibold tabular-nums">${total.toLocaleString()}</strong> ${total === 1 ? 'article' : 'articles'}</p>
                <div class="flex flex-wrap items-center gap-1.5">
                    ${chips.map(([key, label]) => `<button onclick="${key === 'q' ? 'clearQuery()' : `setParams({ ${key}: DEFAULTS.${key}, page: 1 })`}" class="h-7 pl-2.5 pr-2 rounded-full bg-slate-900 border border-slate-700 hover:border-slate-500 text-xs text-slate-200 flex items-center gap-1.5">${label}<i class="ph-bold ph-x text-[10px] text-slate-400"></i></button>`).join('')}
                    ${chips.length > 1 ? '<button onclick="clearAll()" class="h-7 px-2 text-xs text-emerald-300 hover:text-emerald-200">Clear all</button>' : ''}
                </div>`;
        }

        function renderResults() {
            const tokens = WikiSearch.tokenize(state.q);
            if (!results.length) {
                document.getElementById('browseBody').innerHTML = `
                    <div class="rounded-2xl border border-dashed border-slate-700 p-8 text-center space-y-2">
                        <p class="text-white font-semibold">No articles match.</p>
                        <p class="text-sm text-slate-400">Try fewer words, another spelling, or clear a filter.</p>
                    </div>`;
                return;
            }
            const fieldLabel = { title: '', summary: 'in summary', text: 'in article text' };
            document.getElementById('browseBody').innerHTML = `<ul class="space-y-1" role="listbox" aria-label="Articles">${results.map((result, i) => {
                const entry = result.entry;
                const snippet = tokens.length && result.field !== 'title' ? WikiSearch.snippet(entry, tokens) : entry.summary;
                return `
                <li class="result group" data-i="${i}" role="option" aria-selected="false">
                    <button onclick="peek(${i})" class="min-w-0 flex-1 flex gap-3 items-start text-left" aria-label="Quick look: ${escapeHtml(entry.title)}">
                        <span class="nav-tile ${entry.source === 'wiki' ? 'text-cyan-300' : 'text-amber-300'} mt-0.5"><i class="ph-bold ${CATEGORIES[entry.category]?.icon || 'ph-file-text'}"></i></span>
                        <span class="min-w-0 flex-1">
                            <span class="flex flex-wrap items-center gap-x-2 gap-y-1">
                                <strong class="text-[0.9375rem] text-white">${WikiSearch.highlight(entry.title, tokens)}</strong>
                                ${WikiSearch.badge(entry.source)}
                                <span class="text-xs text-slate-400">${CATEGORIES[entry.category]?.label || entry.category}${tokens.length && fieldLabel[result.field] ? ` · ${fieldLabel[result.field]}` : ''}</span>
                            </span>
                            <span class="block text-[0.8125rem] leading-relaxed text-slate-300 mt-1 line-clamp-2">${WikiSearch.highlight(snippet || '', tokens)}</span>
                        </span>
                    </button>
                    <a href="${articleHref(entry.path)}" class="shrink-0 w-9 h-9 rounded-xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 transition" aria-label="Open ${escapeHtml(entry.title)}" title="Open article"><i class="ph-bold ph-arrow-right"></i></a>
                </li>`;
            }).join('')}</ul>`;
        }

        function renderPagination(page, pages, total) {
            const nav = document.getElementById('pagination');
            if (pages <= 1) { nav.innerHTML = ''; return; }
            const from = (page - 1) * PAGE_SIZE + 1;
            const to = Math.min(total, page * PAGE_SIZE);
            const button = (label, target, disabled) => `<button ${disabled ? 'disabled' : ''} onclick="setParams({ page: ${target} }); window.scrollTo({ top: 0 })" class="h-10 px-4 rounded-xl bg-slate-900 border border-slate-700 text-sm text-slate-200 hover:border-slate-500 disabled:opacity-40 disabled:pointer-events-none flex items-center gap-2">${label}</button>`;
            nav.innerHTML = `
                ${button('<i class="ph-bold ph-arrow-left"></i><span class="hidden sm:inline">Previous</span>', page - 1, page === 1)}
                <span class="text-xs text-slate-400 tabular-nums">${from}–${to} of ${total.toLocaleString()} · page ${page}/${pages}</span>
                ${button('<span class="hidden sm:inline">Next</span><i class="ph-bold ph-arrow-right"></i>', page + 1, page === pages)}`;
        }

        // ---------------------------------------------------------------------
        // Search input & keyboard
        // ---------------------------------------------------------------------
        let searchTimer;
        function onSearchInput(value) {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                if (parseHash().view === 'article') location.hash = browseHref({ ...DEFAULTS, q: value });
                else setParams({ q: value, page: 1 }, { push: false });
            }, 80);
        }

        function clearQuery() {
            document.getElementById('codexSearch').value = '';
            setParams({ q: '', page: 1 });
        }

        function onSearchKey(event) {
            if (event.key === 'ArrowDown' && results.length) { event.preventDefault(); event.target.blur(); select(0); }
            else if (event.key === 'Enter') {
                event.preventDefault();
                clearTimeout(searchTimer);
                setParams({ q: event.target.value, page: 1 }, { push: false });
                if (results.length) { event.target.blur(); select(0); }
            }
            else if (event.key === 'Escape') { event.target.blur(); }
        }

        function select(i) {
            if (!results.length) return;
            selected = Math.max(0, Math.min(results.length - 1, i));
            document.querySelectorAll('#browseBody [data-i]').forEach(el => el.setAttribute('aria-selected', String(Number(el.dataset.i) === selected)));
            document.querySelector(`#browseBody [data-i="${selected}"]`)?.scrollIntoView({ block: 'nearest' });
            if (peekIndex !== -1) peek(selected);
        }

        document.addEventListener('keydown', event => {
            const modalOpen = !document.getElementById('createModal').classList.contains('hidden');
            if (event.key === 'Escape') {
                if (modalOpen) return closeCreateModal();
                if (peekIndex !== -1) return closePeek();
            }
            if (modalOpen) return;
            const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
            if (typing) return;
            if (event.key === '/' || (event.key.toLowerCase() === 'k' && (event.metaKey || event.ctrlKey))) {
                event.preventDefault();
                document.getElementById('codexSearch').focus();
                return;
            }
            if (document.getElementById('browseView').classList.contains('is-hidden') || !results.length) return;
            if (event.key === 'ArrowDown' || event.key === 'j') { event.preventDefault(); select(selected + 1); }
            else if (event.key === 'ArrowUp' || event.key === 'k') { event.preventDefault(); select(selected - 1); }
            else if (event.key === ' ' && selected !== -1) { event.preventDefault(); peekIndex === -1 ? peek(selected) : closePeek(); }
            else if (event.key === 'Enter' && selected !== -1) { event.preventDefault(); location.hash = articleHref(results[selected].entry.path); }
        });

        // ---------------------------------------------------------------------
        // Markdown
        // ---------------------------------------------------------------------
        if (window.DOMPurify) {
            DOMPurify.addHook('afterSanitizeAttributes', node => {
                if (node.tagName === 'A' && /^https?:/i.test(node.getAttribute('href') || '')) {
                    node.setAttribute('target', '_blank');
                    node.setAttribute('rel', 'noopener noreferrer');
                }
            });
        }

        function findByTitle(title) {
            const lower = title.trim().toLowerCase();
            return entries.find(entry => entry._title === lower && entry.source !== 'wiki') || entries.find(entry => entry._title === lower);
        }

        function renderMarkdown(markdown) {
            const body = markdown.replace(/^\s*#\s+[^\n]*\n*/, ''); // the page header already shows the title
            const linked = body.replace(/\[\[([^\]]+)\]\]/g, (_, title) => {
                const target = findByTitle(title);
                return target ? `[${title}](${articleHref(target.path)})` : `*${title}*`;
            });
            if (!window.marked || !window.DOMPurify) return `<pre class="whitespace-pre-wrap">${escapeHtml(body)}</pre>`;
            return DOMPurify.sanitize(marked.parse(linked));
        }

        // ---------------------------------------------------------------------
        // Quick look
        // ---------------------------------------------------------------------
        function peek(i) {
            const result = results[i];
            if (!result) return;
            const entry = result.entry;
            peekIndex = i;
            selected = i;
            document.querySelectorAll('#browseBody [data-i]').forEach(el => el.setAttribute('aria-selected', String(Number(el.dataset.i) === i)));
            document.getElementById('peekMeta').innerHTML = `${WikiSearch.badge(entry.source)}<span>${CATEGORIES[entry.category]?.label || entry.category}</span>`;
            document.getElementById('peekTitle').textContent = entry.title;
            document.getElementById('peekOpen').href = articleHref(entry.path);
            const body = document.getElementById('peekBody');
            body.innerHTML = renderMarkdown(entry.body || `# ${entry.title}\n\n${entry.summary || ''}`);
            body.scrollTop = 0;
            const panel = document.getElementById('peekPanel');
            panel.classList.remove('translate-y-full', 'md:translate-x-full');
            const backdrop = document.getElementById('peekBackdrop');
            backdrop.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.toggle('overflow-hidden', window.innerWidth < 768);
        }

        function closePeek() {
            if (peekIndex === -1) return;
            peekIndex = -1;
            document.getElementById('peekPanel').classList.add('translate-y-full', 'md:translate-x-full');
            const backdrop = document.getElementById('peekBackdrop');
            backdrop.classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('overflow-hidden');
        }

        // ---------------------------------------------------------------------
        // Article
        // ---------------------------------------------------------------------
        function slugId(text) {
            return `h-${text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}`;
        }

        function railList(title, items) {
            if (!items.length) return '';
            return `
                <div>
                    <p class="nav-group-label !px-0">${title}</p>
                    <ul class="space-y-1">${items.map(entry => `
                        <li><a href="${articleHref(entry.path)}" class="flex items-center gap-2 py-1 text-sm text-slate-300 hover:text-white"><i class="ph-bold ${CATEGORIES[entry.category]?.icon || 'ph-file-text'} text-slate-500 shrink-0"></i><span class="truncate">${escapeHtml(entry.title)}</span></a></li>`).join('')}
                    </ul>
                </div>`;
        }

        function renderArticle(path) {
            const entry = byPath.get(path);
            const header = document.getElementById('articleHeader');
            const bodyEl = document.getElementById('articleBody');
            const rail = document.getElementById('articleRail');
            const crumbs = document.getElementById('articleCrumbs');
            const back = state.q ? `<a href="${browseHref({ ...DEFAULTS, q: state.q })}" class="flex items-center gap-1.5 text-emerald-300 hover:text-emerald-200 mr-2"><i class="ph-bold ph-arrow-left"></i>Results for “${escapeHtml(state.q)}”</a>` : '';
            if (!entry) {
                crumbs.innerHTML = back;
                header.innerHTML = '<h1 class="font-display font-bold text-2xl text-white">Article not found</h1>';
                bodyEl.innerHTML = `<p>No article at <code>${escapeHtml(path)}</code>. It may have been renamed by a re-sync. <a href="#/">Back to the Codex</a>.</p>`;
                rail.innerHTML = '';
                return;
            }
            const category = CATEGORIES[entry.category];
            crumbs.innerHTML = `${back}<a href="#/" class="hover:text-white">Codex</a><i class="ph-bold ph-caret-right text-[10px]"></i><a href="${browseHref({ ...DEFAULTS, cat: entry.category })}" class="hover:text-white">${category?.label || entry.category}</a><i class="ph-bold ph-caret-right text-[10px]"></i><span class="text-slate-300 truncate max-w-[50vw]">${escapeHtml(entry.title)}</span>`;
            header.innerHTML = `
                <div class="flex flex-wrap items-center gap-2 text-xs text-slate-400">${WikiSearch.badge(entry.source)}<span>${category?.label || entry.category}</span><span class="hidden sm:inline" aria-hidden="true">·</span><code class="hidden sm:inline font-mono text-slate-400">${escapeHtml(entry.path)}</code></div>
                <h1 class="font-display font-bold text-3xl sm:text-4xl text-white leading-tight text-balance">${escapeHtml(entry.title)}</h1>
                ${entry.summary ? `<p class="text-base text-slate-300 leading-relaxed">${escapeHtml(entry.summary)}</p>` : ''}
                <div class="flex flex-wrap items-center gap-2">
                    <button onclick="copyLink()" class="h-9 px-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-slate-500 text-xs text-slate-200 flex items-center gap-2"><i class="ph-bold ph-link"></i>Copy link</button>
                    ${entry.url ? `<a href="${escapeHtml(entry.url)}" target="_blank" rel="noopener noreferrer" class="h-9 px-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-slate-500 text-xs text-slate-200 flex items-center gap-2"><i class="ph-bold ph-arrow-square-out"></i>Original page</a>` : ''}
                    ${entry.source === 'draft' ? `<button data-path="${escapeHtml(entry.path)}" onclick="removeDraft(this.dataset.path)" class="h-9 px-3 rounded-xl border border-rose-500/40 text-rose-300 hover:bg-rose-500/10 text-xs flex items-center gap-2"><i class="ph-bold ph-trash"></i>Remove draft</button>` : ''}
                </div>`;
            bodyEl.innerHTML = renderMarkdown(entry.body || '');
            if (entry.url) bodyEl.insertAdjacentHTML('beforeend', `<p class="text-xs text-slate-500 pt-6 border-t border-slate-800 mt-10">Source: <a href="${escapeHtml(entry.url)}" target="_blank" rel="noopener noreferrer">No Man's Sky Wiki</a> · CC BY-SA 3.0</p>`);

            // Table of contents
            const headings = [...bodyEl.querySelectorAll('h2, h3')];
            const used = new Set();
            headings.forEach(h => {
                let id = slugId(h.textContent);
                while (used.has(id)) id += '-x';
                used.add(id);
                h.id = id;
            });
            const toc = headings.length > 1 ? `
                <div>
                    <p class="nav-group-label !px-0">On this page</p>
                    <nav class="space-y-0.5">${headings.map(h => `<button class="toc-link" data-depth="${h.tagName[1]}" data-target="${h.id}" onclick="document.getElementById(this.dataset.target).scrollIntoView({ behavior: 'smooth' })">${escapeHtml(h.textContent)}</button>`).join('')}</nav>
                </div>` : '';

            // Outgoing [[links]], backlinks ("Mentioned in") and neighbours in the same category
            const outgoing = [...new Set((entry.body || '').match(/\[\[([^\]]+)\]\]/g) || [])]
                .map(link => findByTitle(link.slice(2, -2))).filter(Boolean);
            const mentionedIn = entry._title.length >= 4
                ? entries.filter(other => other !== entry && other._title !== entry._title && (other._body.includes(entry._title))).sort((a, b) => (a.source === 'wiki') - (b.source === 'wiki') || a._title.localeCompare(b._title)).slice(0, 8)
                : [];
            const siblings = entries.filter(other => other.category === entry.category).sort((a, b) => a._title.localeCompare(b._title));
            const at = siblings.indexOf(entry);
            const nearby = siblings.slice(Math.max(0, at - 2), at + 4).filter(other => other !== entry).slice(0, 5);

            rail.innerHTML = toc + railList('Links to', outgoing) + railList('Mentioned in', mentionedIn) + railList(`More in ${category?.label || entry.category}`, nearby);

            if (tocObserver) tocObserver.disconnect();
            if (headings.length > 1) {
                tocObserver = new IntersectionObserver(observed => {
                    observed.forEach(item => {
                        if (!item.isIntersecting) return;
                        rail.querySelectorAll('.toc-link').forEach(link => link.classList.toggle('is-active', link.dataset.target === item.target.id));
                    });
                }, { rootMargin: '-80px 0px -70% 0px' });
                headings.forEach(h => tocObserver.observe(h));
            }
            document.title = `${entry.title} · Wiki Codex`;
            window.scrollTo({ top: 0 });
        }

        function copyLink() {
            const url = location.href;
            (navigator.clipboard?.writeText(url) || Promise.reject())
                .then(() => showToast('Link copied.'))
                .catch(() => showToast(url));
        }

        // ---------------------------------------------------------------------
        // New article (draft + .md download)
        // ---------------------------------------------------------------------
        function openCreateModal() {
            const select = document.getElementById('newCategory');
            if (!select.options.length) select.innerHTML = Object.entries(CATEGORIES).map(([key, meta]) => `<option value="${key}">${meta.label}</option>`).join('');
            if (state.cat in CATEGORIES) select.value = state.cat;
            const modal = document.getElementById('createModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            renderCreatePreview();
            document.getElementById('newTitle').focus();
        }

        function closeCreateModal() {
            const modal = document.getElementById('createModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function renderCreatePreview() {
            const title = document.getElementById('newTitle').value.trim() || 'Untitled article';
            document.getElementById('newPreview').innerHTML = `<h1>${escapeHtml(title)}</h1>` + renderMarkdown(document.getElementById('newBody').value);
        }

        async function saveDraft() {
            const title = document.getElementById('newTitle').value.trim();
            const category = document.getElementById('newCategory').value;
            const body = document.getElementById('newBody').value.trim();
            const slug = WikiSearch.slugify(title);
            if (!slug || !body) {
                showToast('Add a title (letters or numbers) and some Markdown first.');
                return;
            }
            const summary = document.getElementById('newSummary').value.trim()
                || body.replace(/[#*_`>\[\]|-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 200);
            const path = `wiki/custom/${category}/${slug}.md`;
            const markdown = `# ${title}\n\n${body}\n`;
            // Frontmatter format matches what scripts/sync-wiki.mjs writes and parses.
            const fileText = ['---', `title: ${JSON.stringify(title)}`, `category: ${JSON.stringify(category)}`, `summary: ${JSON.stringify(summary)}`,
                'source: "custom"', `updated: ${JSON.stringify(new Date().toISOString().slice(0, 10))}`, '---', '', markdown].join('\n');

            const url = URL.createObjectURL(new Blob([fileText], { type: 'text/markdown' }));
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = `${slug}.md`;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            URL.revokeObjectURL(url);

            WikiSearch.writeDrafts([{ title, slug, category, path, summary, body: markdown }, ...WikiSearch.readDrafts().filter(draft => draft.path !== path)]);
            closeCreateModal();
            ['newTitle', 'newSummary', 'newBody'].forEach(id => { document.getElementById(id).value = ''; });
            await loadEntries();
            location.hash = `#/a/${encodeURIComponent(path)}`;
            showToast(`Downloaded ${slug}.md. Move it into wiki/custom/${category}/ and run npm run index:wiki.`);
        }

        async function removeDraft(path) {
            WikiSearch.writeDrafts(WikiSearch.readDrafts().filter(draft => draft.path !== path));
            await loadEntries();
            location.hash = '#/';
            showToast('Draft removed.');
        }

        function showToast(message) {
            const banner = document.getElementById('toastBanner');
            document.getElementById('toastMessage').textContent = message;
            banner.classList.remove('hidden');
            banner.classList.add('flex');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => {
                banner.classList.add('hidden');
                banner.classList.remove('flex');
            }, 3500);
        }

        // ---------------------------------------------------------------------
        // Boot
        // ---------------------------------------------------------------------
        async function loadEntries() {
            entries = await WikiSearch.load('./', { withBodies: true });
            byPath = new Map(entries.map(entry => [entry.path, entry]));
        }

        window.addEventListener('hashchange', route);
        window.addEventListener('resize', () => { if (window.innerWidth >= 768 && peekIndex === -1) document.body.classList.remove('overflow-hidden'); });

        (async () => {
            document.getElementById('browseBody').innerHTML = '<p class="text-sm text-slate-400 py-8">Loading the Codex…</p>';
            await loadEntries();
            route();
        })();
    </script>
</body>
</html>
